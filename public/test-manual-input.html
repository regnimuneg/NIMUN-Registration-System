<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Input Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            width: 100%;
        }
        button:hover { background: #2563eb; }
        .result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .success { background: #d1fae5; color: #065f46; }
        .error { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Manual Input Test</h1>
        <p>Test participant lookup without needing a camera</p>
    </div>

    <div class="container">
        <h2>Test Participants</h2>
        <p>Click any button to test loading participant data:</p>
        
        <button onclick="testParticipant('EX-01')">EX-01 - Ahmed Hassan (Executive)</button>
        <button onclick="testParticipant('OP-02')">OP-02 - Sarah Ahmed (Operations)</button>
        <button onclick="testParticipant('PR-03')">PR-03 - Mohamed Ali (Public Relations)</button>
        <button onclick="testParticipant('MD-04')">MD-04 - Fatma Mahmoud (Media & Design)</button>
        <button onclick="testParticipant('RG-05')">RG-05 - Omar Khaled (Registration Affairs)</button>
        <button onclick="testParticipant('SO-06')">SO-06 - Nour Ibrahim (Socials)</button>
        
        <div id="result"></div>
    </div>

    <div class="container">
        <h2>Custom Test</h2>
        <input type="text" id="customId" placeholder="Enter participant ID (e.g., EX-01)" 
               style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px;">
        <button onclick="testCustomParticipant()">Test Custom ID</button>
    </div>

    <script>
        async function testParticipant(participantId) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '⏳ Loading participant data...';
            
            try {
                console.log(`Testing participant: ${participantId}`);
                
                const participantResponse = await fetch(`/api/participants/${participantId}`);
                if (!participantResponse.ok) {
                    throw new Error(`Participant not found: ${participantResponse.status}`);
                }
                const participant = await participantResponse.json();
                console.log('Participant data:', participant);
                
                const trackingResponse = await fetch(`/api/participants/${participantId}/tracking`);
                let tracking = null;
                if (trackingResponse.ok) {
                    tracking = await trackingResponse.json();
                    console.log('Tracking data:', tracking);
                }
                
                resultDiv.innerHTML = `
                    <div class="result success">
                        <h3>✅ Success!</h3>
                        <p><strong>ID:</strong> ${participant.id}</p>
                        <p><strong>Name:</strong> ${participant.name}</p>
                        <p><strong>Position:</strong> ${participant.position}</p>
                        <p><strong>Phone:</strong> ${participant.phoneNumber}</p>
                        <p><strong>Tracking Data:</strong> ${tracking ? 'Available' : 'Will be initialized'}</p>
                        <p><em>Participant would be loaded successfully in main app!</em></p>
                    </div>
                `;
                
            } catch (error) {
                console.error('Error testing participant:', error);
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Error</h3>
                        <p>${error.message}</p>
                        <p><em>This participant might need to be imported first.</em></p>
                    </div>
                `;
            }
        }
        
        function testCustomParticipant() {
            const customId = document.getElementById('customId').value.trim();
            if (customId) {
                testParticipant(customId);
            } else {
                document.getElementById('result').innerHTML = `
                    <div class="result error">
                        <h3>❌ Error</h3>
                        <p>Please enter a participant ID</p>
                    </div>
                `;
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Manual input test page loaded');
            setTimeout(() => testParticipant('EX-01'), 1000);
        });
    </script>
</body>
</html>
