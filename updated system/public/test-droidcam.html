<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DroidCam Virtual Camera Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .warning { background: #fff3cd; border: 1px solid #ffeaa7; color: #856404; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        video { max-width: 500px; border: 2px solid #ddd; border-radius: 8px; }
        button { padding: 10px 20px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-danger { background: #dc3545; color: white; }
    </style>
</head>
<body>
    <h1>🎥 DroidCam Virtual Camera Test</h1>
    
    <div id="status"></div>
    
    <div>
        <button id="listCameras" class="btn-primary">📋 List Available Cameras</button>
        <button id="startCamera" class="btn-success">▶️ Start Camera</button>
        <button id="stopCamera" class="btn-danger">⏹️ Stop Camera</button>
    </div>
    
    <div style="margin: 20px 0;">
        <video id="video" autoplay playsinline muted></video>
    </div>
    
    <div id="cameraList"></div>
    
    <script>
        const statusDiv = document.getElementById('status');
        const videoElement = document.getElementById('video');
        const cameraListDiv = document.getElementById('cameraList');
        let currentStream = null;
        
        function showStatus(message, type = 'success') {
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        async function listCameras() {
            try {
                showStatus('🔍 Checking available cameras...', 'warning');
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                
                if (videoDevices.length === 0) {
                    showStatus('❌ No video devices found', 'error');
                    return;
                }
                
                let html = '<h3>📹 Available Cameras:</h3><ul>';
                let virtualCameraFound = false;
                
                const virtualCameraNames = ['droidcam', 'obs', 'virtual', 'webcam', 'manycam', 'splitcam'];
                
                videoDevices.forEach((device, index) => {
                    const isVirtual = virtualCameraNames.some(name => 
                        device.label.toLowerCase().includes(name)
                    );
                    
                    if (isVirtual) {
                        virtualCameraFound = true;
                    }
                    
                    html += `<li style="margin: 5px 0; ${isVirtual ? 'background: #e7f3ff; padding: 5px; border-radius: 3px;' : ''}">
                        <strong>${isVirtual ? '🎥 VIRTUAL: ' : '📷 '}${device.label || `Camera ${index + 1}`}</strong><br>
                        <small>ID: ${device.deviceId}</small>
                    </li>`;
                });
                
                html += '</ul>';
                
                if (virtualCameraFound) {
                    showStatus('✅ Virtual camera detected! DroidCam optimizations will be applied.', 'success');
                } else {
                    showStatus('ℹ️ No virtual cameras detected. Using standard settings.', 'warning');
                }
                
                cameraListDiv.innerHTML = html;
                
            } catch (error) {
                showStatus(`❌ Error listing cameras: ${error.message}`, 'error');
            }
        }
        
        async function startCamera() {
            try {
                showStatus('🚀 Starting camera...', 'warning');
                
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                const virtualCameraNames = ['droidcam', 'obs', 'virtual', 'webcam', 'manycam', 'splitcam'];
                const hasVirtualCamera = videoDevices.some(device => 
                    virtualCameraNames.some(name => 
                        device.label.toLowerCase().includes(name)
                    )
                );
                
                const constraints = {
                    video: {
                        width: { ideal: hasVirtualCamera ? 1280 : 1920, min: 640 },
                        height: { ideal: hasVirtualCamera ? 720 : 1080, min: 480 },
                        facingMode: 'environment'
                    }
                };
                
                if (!hasVirtualCamera) {
                    constraints.video.focusMode = 'continuous';
                    constraints.video.exposureMode = 'continuous';
                }
                
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
                
                const track = currentStream.getVideoTracks()[0];
                const settings = track.getSettings();
                
                showStatus(`✅ Camera started! Resolution: ${settings.width}x${settings.height}`, 'success');
                
                if (hasVirtualCamera) {
                    showStatus('🎥 Virtual camera detected - using optimized settings', 'warning');
                }
                
            } catch (error) {
                showStatus(`❌ Error starting camera: ${error.message}`, 'error');
            }
        }
        
        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
                videoElement.srcObject = null;
                showStatus('⏹️ Camera stopped', 'warning');
            } else {
                showStatus('ℹ️ No camera to stop', 'warning');
            }
        }
        
        document.getElementById('listCameras').addEventListener('click', listCameras);
        document.getElementById('startCamera').addEventListener('click', startCamera);
        document.getElementById('stopCamera').addEventListener('click', stopCamera);
        
        window.addEventListener('load', listCameras);
        
        showStatus('🔧 DroidCam test page loaded. Testing virtual camera detection...', 'warning');
    </script>
</body>
</html>
